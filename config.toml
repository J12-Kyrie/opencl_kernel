[kernel]
name = "image_preprocess"
description = "Fused resize + normalize + transpose for VIT preprocessing"
author = "IQ9 Team"
version = "1.0.0"
build_command = "cmake ../solution/host -DCMAKE_BUILD_TYPE=Release && make -j$(nproc)"

[device]
ssh_host = "192.168.100.102"
ssh_user = "ubuntu"
ssh_password = "Hello123"
workspace = "/mnt/workspace/opencl_kernel"
build_dir = "/mnt/workspace/opencl_kernel/build"
gpu = "Adreno 663"
soc = "QCS9075"

[benchmark]
resolutions = ["320x240", "640x480", "800x600", "1024x768", "1280x720", "1600x900", "1920x1080", "3840x2160"]
target_width = 448
target_height = 448
iterations_per_resolution = 100
warmup_iterations = 10
cpu_tolerance = 0.0001

[optimization]
max_iterations = 100
plateau_threshold = 5
research_agent_trigger = 5
ab_test_threshold = 0.05
